# Served by `wrangler dev --local`, against a local D1: no Cloudflare account
# is involved, and the database id below names nothing real.
name = "sqlx-cloudflare-d1-test"
main = "build/worker/shim.mjs"
compatibility_date = "2026-01-01"

[build]
command = "worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "sqlx-cloudflare-d1-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
