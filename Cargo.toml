[workspace]
resolver = "2"
members = ["crates/*"]
# The test Worker is its own package, not a member: it only builds for
# wasm32-unknown-unknown, through `worker-build`, and keeps its own lock.
# Without this, cargo finds this manifest above it and refuses to build it.
exclude = ["crates/sqlx-cloudflare-d1/tests/worker"]

[workspace.package]
# No `version` here on purpose: each crate carries a literal one instead of
# inheriting, because release-please's cargo-workspace plugin cannot read
# `version.workspace = true` -- it reports "package manifest has an invalid
# [package.version]" and releases nothing (googleapis/release-please#2111).
edition = "2021"
# sqlx 0.9's own floor; see rust-toolchain.toml.
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/sqlx-contrib/sqlx-cloudflare"

# Denied rather than warned, to match the rest of this ecosystem: a lint these
# crates tolerate is a lint their consumers cannot. `priority = -1` lets an
# individual `allow` in a crate override the group.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.lints.rust]
missing_docs = "deny"

[workspace.dependencies]
# `sqlx-core`, not `sqlx`: it is what drivers build on, and `sqlx` re-exports
# it, so a consumer's `sqlx::Database` is a driver's
# `sqlx_core::database::Database` as long as the two resolve to one version.
#
# `offline` is always on. sqlx's own default `macros` feature enables
# `sqlx-core/offline`, which adds `describe` to `Executor` as a *required*
# method -- so a driver that only implemented it behind a feature of its own
# would stop compiling the moment a consumer kept sqlx's defaults.
sqlx-core = { version = "0.9", default-features = false, features = ["offline"] }
# The facade, for tests only: proving a consumer naming `sqlx::Database` sees
# a driver's database type.
sqlx = { version = "0.9", default-features = false }
worker = { version = "0.8.6", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false }
log = { version = "0.4", default-features = false }
ureq = { version = "3", default-features = false }
serde_json = "1"
