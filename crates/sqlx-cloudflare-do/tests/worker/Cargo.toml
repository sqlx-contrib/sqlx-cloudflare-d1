# The Worker the integration tests run against. Not part of the published
# crate, and its own package rather than a workspace member: it only builds
# for wasm32-unknown-unknown, through `worker-build`, and keeps its own lock.
[package]
name = "sqlx-cloudflare-do-test-worker"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
sqlx-cloudflare-do = { path = "../.." }
sqlx = { version = "0.9", default-features = false, features = ["derive", "macros"] }
worker = "0.8.6"
# `#[durable_object]` expands to code that names `wasm_bindgen` directly.
wasm-bindgen = "0.2"
serde_json = "1"
futures-util = { version = "0.3", default-features = false }

[profile.release]
opt-level = "s"
