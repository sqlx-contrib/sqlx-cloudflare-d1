name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      # wasm32-unknown-unknown from day one: the crates only run there, and a
      # dependency that pulls in a socket, a runtime or a C library breaks that
      # target without the host build noticing.
      - name: Run Check
        run: nix develop --command make check

      - name: Run Lint
        run: nix develop --command make lint

      - name: Run Tests
        run: nix develop --command make test

      # The test Worker under `wrangler dev --local`, on a local D1 -- no
      # Cloudflare account or secret involved. `worker-build` fetches the
      # wasm-bindgen, wasm-opt and esbuild versions it needs on first use.
      - name: Run Worker Tests
        run: nix develop --command make test-worker

      - name: Check Documentation
        run: nix develop --command make doc-check

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    outputs:
      # `releases_created`, plural: that is the output a manifest config sets.
      release_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          manifest-file: .github/config/release-please-manifest.json
          config-file: .github/config/release-please-config.json
          target-branch: main

  # No `build` job: these are library crates with no binary, so there is
  # nothing to `nix build` and no asset to attach to the release. The crates
  # themselves are the artifact, and they go to crates.io below.
  publish:
    needs: release
    # Compared against the string, not used as a truth value: release-please
    # reports "false" when it created nothing, and a non-empty string is
    # truthy in an Actions expression.
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Authenticate with Crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # `--workspace`, as in sqlx-query: it walks the dependency graph, so a
      # crate goes up only after the workspace crates it depends on.
      - name: Publish to Crates.io
        run: nix develop --command cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
